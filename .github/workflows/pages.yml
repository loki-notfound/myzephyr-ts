# Guide site: builds the static site of the guide in docs/guide/ (bin/build_site.sh), checks it
# (bin/check_site.sh) and publishes build/site/ with GitHub Pages, on pushes to main that change the
# guide, the site tooling or this workflow, and by manual dispatch. The site has no JavaScript and loads
# nothing from elsewhere. No secrets; the build job reads the repository only, and only the deploy job
# may write to Pages. See BUILDING.md, "The guide and its site".
name: guide site

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "site/**"
      - "bin/build_site.sh"
      - "bin/check_site.sh"
      - "bin/pins.sh"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a deployment in progress is never cancelled (a newer run waits for it).
concurrency:
  group: ${{ github.workflow }}-pages
  cancel-in-progress: false

jobs:
  build:
    name: build and check the guide site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TZ: UTC
    defaults:
      run:
        shell: bash # bash --noprofile --norc -eo pipefail
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Build the site (bin/build_site.sh)
        run: |
          echo "commit: $(git rev-parse HEAD); node $(node --version)"
          bin/build_site.sh

      - name: Check the site (bin/check_site.sh)
        run: bin/check_site.sh

      - name: Upload the site (Pages artifact)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site/
          retention-days: 1

  deploy:
    name: deploy the guide site
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
